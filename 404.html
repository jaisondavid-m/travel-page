<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Joy Travels</title>
    <link rel="icon" type="image/png" href="pic/logo.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: orangered;
            font-size: 4rem;
            margin-bottom: 10px;
        }
        h2 {
            margin-bottom: 15px;
            color: #333;
        }
        p {
            color: #666;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: orangered;
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #e04000;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for does not exist. You will be redirected to the homepage shortly.</p>
        <a href="index.html" class="btn">Return to Home</a>
    </div>
    <script>
        // Redirect to homepage after 3 seconds
        setTimeout(function() {
            window.location.href = "index.html";
        }, 3000);
    </script>
</body>
</html>
